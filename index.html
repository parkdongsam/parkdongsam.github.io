<!doctype html>
<html lang="ko" data-theme="gothic">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>박동삼 · 김연의 결혼합니다</title>
  <meta name="description" content="2026년 10월 25일 일요일 오후 1시 40분 · 오펠리스 웨딩컨벤션 라비제홀" />
  <meta name="theme-color" content="#ffffff" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="박동삼 · 김연의 결혼합니다" />
  <meta property="og:description" content="2026년 10월 25일 일요일 오후 1시 40분 · 오펠리스 웨딩컨벤션 라비제홀" />
  <meta property="og:url" content="https://parkdongsam.github.io/" />
  <meta property="og:image" content="https://parkdongsam.github.io/images/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23111' stroke-width='1.5'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" crossorigin />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/themes.css" />
</head>
<body>
  <main class="page">

    <!-- ============================ INVITATION ============================ -->
    <section class="sec hero" aria-labelledby="h-inv">
      <p class="label" id="h-inv">Invitation</p>
      <h1 class="title" data-bind="headline"></h1>

      <blockquote class="quote" data-lines="quote.lines" data-optional></blockquote>
      <p class="quote__src" data-bind="quote.source" data-optional></p>

      <div class="invite" data-lines="invitation" data-reveal></div>

      <div class="names" data-names data-reveal></div>
    </section>

    <!-- =============================== DATE =============================== -->
    <section class="sec" aria-labelledby="h-date">
      <p class="label" id="h-date">Date</p>
      <h2 class="date__big" data-reveal>
        <time data-date-iso data-date-big></time>
      </h2>
      <p class="date__sub" data-date-sub data-reveal></p>

      <div class="cal" data-reveal>
        <div class="cal__head" aria-hidden="true">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div class="cal__grid" data-cal role="presentation"></div>
      </div>

      <div class="count" data-reveal aria-hidden="true">
        <div class="count__unit"><span class="count__label">Days</span><span class="count__num" data-count="d">–</span></div>
        <span class="count__sep">:</span>
        <div class="count__unit"><span class="count__label">Hour</span><span class="count__num" data-count="h">–</span></div>
        <span class="count__sep">:</span>
        <div class="count__unit"><span class="count__label">Min</span><span class="count__num" data-count="m">–</span></div>
        <span class="count__sep">:</span>
        <div class="count__unit"><span class="count__label">Sec</span><span class="count__num" data-count="s">–</span></div>
      </div>
      <p class="dday" data-dday data-reveal></p>
    </section>

    <!-- ============================= LOCATION ============================= -->
    <section class="sec" aria-labelledby="h-loc">
      <p class="label" id="h-loc">Location</p>
      <h2 class="title">오시는 길</h2>

      <p class="venue__name" data-venue-name data-reveal></p>
      <p class="venue__addr" data-bind="venue.address" data-reveal></p>
      <p class="venue__tel" data-reveal>Tel. <span data-bind="venue.tel"></span></p>

      <a class="map" data-map-link href="#" target="_blank" rel="noopener" aria-label="지도에서 보기" data-reveal>Map</a>
      <a class="btn btn--ghost btn--full" data-sketch href="#" target="_blank" rel="noopener">약도 이미지 보기</a>

      <div class="nav" data-reveal>
        <p class="sub">내비게이션</p>
        <p>원하시는 앱을 선택하시면 길안내가 시작됩니다.</p>
        <div class="nav__apps">
          <a class="btn" data-nav="naver" href="#" target="_blank" rel="noopener">네이버지도</a>
          <a class="btn" data-nav="tmap" href="#">티맵</a>
          <a class="btn" data-nav="kakao" href="#" target="_blank" rel="noopener">카카오맵</a>
        </div>
      </div>

      <div class="transit">
        <div class="transit__block" data-reveal>
          <p class="sub">지하철</p>
          <ul class="transit__list" data-subway></ul>
          <p class="transit__note" data-subway-note></p>
        </div>
        <div class="transit__block" data-reveal>
          <p class="sub">버스</p>
          <ul class="transit__list" data-bus></ul>
          <div class="transit__note" data-shuttle></div>
        </div>
        <div class="transit__block" data-reveal>
          <p class="sub">자가용</p>
          <div class="transit__lines" data-lines="transit.car"></div>
        </div>
      </div>
    </section>

    <!-- =========================== INFORMATION ============================ -->
    <section class="sec" aria-labelledby="h-info" data-hide-if-empty="info">
      <p class="label" id="h-info">Information</p>
      <h2 class="title">예식정보 및 안내사항</h2>
      <div class="info" data-info data-reveal></div>
    </section>

    <!-- ============================== GALLERY ============================= -->
    <section class="sec" aria-labelledby="h-gal">
      <p class="label" id="h-gal">Gallery</p>
      <h2 class="title">웨딩 갤러리</h2>

      <div class="gal" data-reveal>
        <div class="gal__stage">
          <div class="gal__track" data-gal-track aria-roledescription="carousel" aria-label="웨딩 사진"></div>
          <button class="gal__arrow gal__arrow--prev" type="button" data-gal-prev aria-label="이전 사진">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button class="gal__arrow gal__arrow--next" type="button" data-gal-next aria-label="다음 사진">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
        <div class="gal__thumbs" data-gal-thumbs></div>
        <p class="gal__count" data-gal-count aria-hidden="true"></p>
      </div>
    </section>

    <!-- ============================== ACCOUNT ============================= -->
    <section class="sec" aria-labelledby="h-acct">
      <p class="label" id="h-acct">Account</p>
      <h2 class="title">마음 전하실 곳</h2>
      <div class="lead" data-lines="accountNote" data-reveal></div>

      <div class="tabs" role="tablist" aria-label="계좌 구분" data-reveal>
        <button class="tab" role="tab" type="button" data-side="groom" aria-selected="true">신랑측</button>
        <button class="tab" role="tab" type="button" data-side="bride" aria-selected="false">신부측</button>
      </div>
      <div class="acct" data-acct role="tabpanel"></div>
    </section>

    <!-- =============================== FOOTER ============================= -->
    <footer class="foot">
      <p class="foot__names"><span data-bind="groom.name"></span> · <span data-bind="bride.name"></span></p>
      <p class="foot__date"><span data-date-big></span></p>
      <button class="btn btn--ghost" type="button" data-share>청첩장 공유하기</button>
    </footer>
  </main>

  <div class="lab" role="group" aria-label="디자인 변형">
    <button type="button" data-theme="batang">A</button>
    <button type="button" data-theme="gothic">B</button>
    <button type="button" data-theme="poster">C</button>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
